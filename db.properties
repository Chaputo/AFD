# Conexión a la base de datos de AFD System.
# La aplicación busca este archivo en la carpeta desde donde se ejecuta
# y, si no lo encuentra, junto al .jar (en el .exe: carpeta "app").
db.host=localhost
db.puerto=3306
db.nombre=gestioncomercialdb
db.usuario=root
db.clave=

# Opcional, en db.local.properties (no se sube al repo): iniciar un servidor local
# si la base no responde al abrir la app.
# db.servidor.exe=C:/ruta/a/mariadb/bin/mariadbd.exe
# db.servidor.config=C:/ruta/a/data/my.ini
